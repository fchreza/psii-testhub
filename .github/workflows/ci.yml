name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Test, typecheck, build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/psii_testhub
      SESI_SECRET: ci-only-secret-with-at-least-32-characters
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install PDF test utilities
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Test
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
